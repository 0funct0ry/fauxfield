name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libasound2-dev libfontconfig-dev libssl-dev
      # GitHub's macOS runners ship the Metal toolchain, so no runtime-shaders feature is needed.
      - run: cargo fmt --all --check
      - run: scripts/lint-colors.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated references are up to date
        if: runner.os == 'Linux'
        run: cargo xtask check
      - run: cargo build --workspace --release
      - name: Headless build (no GPUI)
        run: cargo build -p fauxfield --no-default-features --features headless
      - name: Headless build has no GPUI dependency
        if: runner.os != 'Windows'
        run: make verify-headless

  # Headless `fauxfield mcp` over stdio (and the unix socket where there is one), no GPU or display.
  smoke-headless:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fauxfield --no-default-features --features headless --test mcp

  # Headless run (M3): the engine and control crates on every OS; `fauxfield run` serving a
  # workspace with `status`, `logs` and `stop` attached over the control socket where there is one
  # (no named pipe on Windows yet).
  headless-run:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fauxfield-engine -p fauxfield-control
      - run: cargo test -p fauxfield --no-default-features --features headless --test run

  # The dev-mcp app driven by the scenarios in fixtures/scenarios; fails on a failed step or an
  # audit error. Linux runs under xvfb with ImageMagick for screenshots; macOS runners have no
  # Screen Recording permission, so it skips screenshots.
  smoke-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries and display tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libasound2-dev libfontconfig-dev libssl-dev \
            xvfb imagemagick mesa-vulkan-drivers
      - name: Scenarios (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" scripts/smoke-ui.sh
      - name: Scenarios (macOS, no capture)
        if: runner.os == 'macOS'
        run: scripts/smoke-ui.sh --no-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-ui-${{ runner.os }}
          path: target/smoke

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

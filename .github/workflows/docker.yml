# Docker image from the headless build, published to ghcr.io/0funct0ry/fauxfield (M19).
name: Docker
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0-rc.1)
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: t
        run: |
          v="${TAG#v}"
          tags="ghcr.io/0funct0ry/fauxfield:$v"
          case "$v" in *-*) ;; *) tags="$tags,ghcr.io/0funct0ry/fauxfield:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.t.outputs.tags }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/0funct0ry/fauxfield
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["0funct0ry"]
homepage = "https://0funct0ry.github.io/fauxfield/"
repository = "https://github.com/0funct0ry/fauxfield"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# GPUI is pre-1.0; exact pin, see docs/adr/001-gpui-version.md.
gpui = "=0.2.2"
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "signal", "sync", "time", "fs"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
toml_edit = "0.22"
notify = "8"
getrandom = "0.3"
thiserror = "2"
tempfile = "3"
fauxfield-model = { path = "crates/fauxfield-model" }
fauxfield-store = { path = "crates/fauxfield-store" }
fauxfield-engine = { path = "crates/fauxfield-engine" }
fauxfield-control = { path = "crates/fauxfield-control" }
fauxfield-openapi = { path = "crates/fauxfield-openapi" }
fauxfield-mcp = { path = "crates/fauxfield-mcp" }
fauxfield-gui = { path = "crates/fauxfield-gui" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"

# M17.04: size-optimise everything the headless binary contains so it stays under the SPEC §15
# 15 MB budget: Fauxfield's own crates at "s", third-party at "z" (panic stays "unwind": template rendering catches panics). The GUI crate is not
# in the headless build; it and gpui keep opt-level 3.
[profile.release.package."*"]
opt-level = "z"
[profile.release.package.gpui]
opt-level = 3
[profile.release.package.fauxfield-gui]
opt-level = 3

# The profile cargo-dist builds with.
[profile.dist]
inherits = "release"

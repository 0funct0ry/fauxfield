schema = 1
id = "srv_streaming_media_catalog"
name = "Catalog"
enabled = true
host = "127.0.0.1"
port = 4001
fake_seed = 42

[cors]
enabled = true
origins = ["*"]

[[datasets]]
name = "titles"
key = "id"
id_strategy = "increment"

[datasets.generator]
rows = 40

[[datasets.generator.fields]]
name = "id"
kind = "sequence"

[[datasets.generator.fields]]
name = "title"
kind = "one_of"
values = ["Midnight Harbor", "Paper Lanterns", "Orbit Seven", "The Quiet Valley", "Neon Orchard", "Copper Skies", "Static Bloom", "Lost Meridian"]

[[datasets.generator.fields]]
name = "kind"
kind = "one_of"
values = ["movie", "series", "album", "podcast"]

[[datasets.generator.fields]]
name = "genre"
kind = "one_of"
values = ["drama", "comedy", "documentary", "scifi", "jazz", "ambient"]

[[datasets.generator.fields]]
name = "year"
kind = "int"
min = 1990
max = 2025

[[datasets.generator.fields]]
name = "duration_min"
kind = "int"
min = 20
max = 180

[[datasets.generator.fields]]
name = "rating"
kind = "float"
min = 1
max = 5

[[datasets]]
name = "genres"
key = "id"
id_strategy = "increment"

[datasets.generator]
rows = 6

[[datasets.generator.fields]]
name = "id"
kind = "sequence"

[[datasets.generator.fields]]
name = "name"
kind = "one_of"
values = ["Drama", "Comedy", "Documentary", "Sci-Fi", "Jazz", "Ambient"]

[[folders]]
id = "fld_catalog_1"
name = "Titles"

[[folders]]
id = "fld_catalog_2"
name = "Genres"

[[folders]]
id = "fld_catalog_3"
name = "People"

[[routes]]
id = "rte_catalog_1"
name = "Titles"
folder = "fld_catalog_1"
kind = "crud"
path = "/titles"
dataset = "titles"

[[routes]]
id = "rte_catalog_2"
name = "Genres"
folder = "fld_catalog_2"
kind = "crud"
path = "/genres"
dataset = "genres"

[[routes]]
id = "rte_catalog_3"
name = "Search titles"
folder = "fld_catalog_1"
method = "GET"
path = "/search"

  [[routes.responses]]
  id = "rsp_catalog_3_1"
  name = "Missing query"
  status = 400
  content_type = "application/json"
  body = '''
{"error":"query parameter q is required"}
'''

    [[routes.responses.rules]]
    target = "query"
    key = "q"
    op = "absent"

  [[routes.responses]]
  id = "rsp_catalog_3_2"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  delay_ms = "40..140"
  body = '''
[{% for i in range(end=5) %}{"id":{{ i + 1 }},"title":"{{ fake(kind="lorem.word") }} {{ fake(kind="lorem.word") }}","kind":"movie","rating":{{ random_int(min=1, max=5) }}.5}{% if not loop.last %},{% endif %}{% endfor %}]
'''

[[routes]]
id = "rte_catalog_4"
name = "Credits"
folder = "fld_catalog_1"
method = "GET"
path = "/titles/:id/credits"

  [[routes.responses]]
  id = "rsp_catalog_4_1"
  name = "Unknown title"
  status = 404
  content_type = "application/json"
  body = '''
{"error":"title not found"}
'''

    [[routes.responses.rules]]
    target = "param"
    key = "id"
    op = "eq"
    value = "999"

  [[routes.responses]]
  id = "rsp_catalog_4_2"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
[{% for i in range(end=3) %}{"name":"{{ fake(kind="name") }}","role":"cast"}{% if not loop.last %},{% endif %}{% endfor %}]
'''

[[routes]]
id = "rte_catalog_5"
name = "Similar titles"
folder = "fld_catalog_1"
method = "GET"
path = "/titles/:id/similar"

  [[routes.responses]]
  id = "rsp_catalog_5_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
[{% for i in range(end=4) %}{"id":{{ random_int(min=1, max=40) }},"title":"{{ fake(kind="lorem.word") }}"}{% if not loop.last %},{% endif %}{% endfor %}]
'''

[[routes]]
id = "rte_catalog_6"
name = "New releases"
folder = "fld_catalog_1"
method = "GET"
path = "/new"

  [[routes.responses]]
  id = "rsp_catalog_6_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
[{% for i in range(end=5) %}{"id":{{ i + 1 }},"released":"{{ fake(kind="date.past") }}"}{% if not loop.last %},{% endif %}{% endfor %}]
'''

[[routes]]
id = "rte_catalog_7"
name = "Person"
folder = "fld_catalog_3"
method = "GET"
path = "/people/:id"

  [[routes.responses]]
  id = "rsp_catalog_7_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
{"id":"{{ request.params.id }}","name":"{{ fake(kind="name") }}","known_for":["{{ fake(kind="lorem.word") }}"]}
'''

[[routes]]
id = "rte_catalog_8"
name = "Titles in genre"
folder = "fld_catalog_2"
method = "GET"
path = "/genres/:id/titles"

  [[routes.responses]]
  id = "rsp_catalog_8_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
[{% for i in range(end=4) %}{"id":{{ i + 1 }},"title":"{{ fake(kind="lorem.word") }}"}{% if not loop.last %},{% endif %}{% endfor %}]
'''

[[routes]]
id = "rte_catalog_9"
name = "Health"
method = "GET"
path = "/health"

  [[routes.responses]]
  id = "rsp_catalog_9_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
{"status":"ok","service":"catalog"}
'''

schema = 1
id = "srv_banking_fx"
name = "FX"
enabled = true
host = "127.0.0.1"
port = 4006
fake_seed = 42

[cors]
enabled = true
origins = ["*"]

[variables]
base = "USD"

[[datasets]]
name = "pairs"
key = "id"
id_strategy = "increment"

[datasets.generator]
rows = 6

[[datasets.generator.fields]]
name = "id"
kind = "sequence"

[[datasets.generator.fields]]
name = "pair"
kind = "one_of"
values = ["USD/EUR", "USD/GBP", "EUR/GBP", "USD/JPY", "GBP/EUR", "EUR/USD"]

[[datasets.generator.fields]]
name = "rate"
kind = "float"
min = 0.5
max = 150

[[folders]]
id = "fld_fx_1"
name = "Rates"

[[folders]]
id = "fld_fx_2"
name = "Conversions"

[[routes]]
id = "rte_fx_1"
name = "Currency pairs"
folder = "fld_fx_1"
kind = "crud"
path = "/pairs"
dataset = "pairs"

[[routes]]
id = "rte_fx_2"
name = "Latest rates"
folder = "fld_fx_1"
method = "GET"
path = "/rates"

  [[routes.responses]]
  id = "rsp_fx_2_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  delay_ms = "20..60"
  body = '''
{"base":"{{ vars.base }}","as_of":"{{ now() }}","rates":{"EUR":0.{{ random_int(min=90, max=95) }},"GBP":0.{{ random_int(min=77, max=82) }},"JPY":{{ random_int(min=140, max=155) }}.2}}
'''

[[routes]]
id = "rte_fx_3"
name = "Rate for pair"
folder = "fld_fx_1"
method = "GET"
path = "/rates/:pair"

  [[routes.responses]]
  id = "rsp_fx_3_1"
  name = "Unsupported pair"
  status = 404
  content_type = "application/json"
  body = '''
{"error":"unsupported pair"}
'''

    [[routes.responses.rules]]
    target = "param"
    key = "pair"
    op = "eq"
    value = "XXX-YYY"

  [[routes.responses]]
  id = "rsp_fx_3_2"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
{"pair":"{{ request.params.pair }}","rate":{{ random_int(min=1, max=150) }}.{{ random_int(min=10, max=99) }}}
'''

[[routes]]
id = "rte_fx_4"
name = "Rate history"
folder = "fld_fx_1"
method = "GET"
path = "/rates/:pair/history"

  [[routes.responses]]
  id = "rsp_fx_4_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
[{% for i in range(end=5) %}{"day":"{{ fake(kind="date.past") }}","rate":{{ random_int(min=1, max=150) }}.50}{% if not loop.last %},{% endif %}{% endfor %}]
'''

[[routes]]
id = "rte_fx_5"
name = "Convert amount"
folder = "fld_fx_2"
method = "POST"
path = "/convert"

  [[routes.responses]]
  id = "rsp_fx_5_1"
  name = "Amount missing"
  status = 422
  content_type = "application/json"
  body = '''
{"error":"amount is required"}
'''

    [[routes.responses.rules]]
    target = "body"
    key = "$.amount"
    op = "absent"

  [[routes.responses]]
  id = "rsp_fx_5_2"
  name = "Created"
  status = 200
  content_type = "application/json"
  default = true
  delay_ms = "40..120"
  body = '''
{"from":"{{ request.json.from | default(value='USD') }}","to":"{{ request.json.to | default(value='EUR') }}","amount":{{ request.json.amount | default(value=0) }},"converted":{{ random_int(min=1, max=900) }}.12}
'''

[[routes]]
id = "rte_fx_6"
name = "Lock quote"
folder = "fld_fx_2"
method = "POST"
path = "/quotes"

  [[routes.responses]]
  id = "rsp_fx_6_1"
  name = "Created"
  status = 201
  content_type = "application/json"
  default = true
  body = '''
{"quote_id":"qte_{{ uuid() }}","valid_seconds":30,"rate":0.92}
'''

[[routes]]
id = "rte_fx_7"
name = "Currencies"
folder = "fld_fx_1"
method = "GET"
path = "/currencies"

  [[routes.responses]]
  id = "rsp_fx_7_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
["USD","EUR","GBP","JPY","CHF"]
'''

[[routes]]
id = "rte_fx_8"
name = "Health"
method = "GET"
path = "/health"

  [[routes.responses]]
  id = "rsp_fx_8_1"
  name = "OK"
  status = 200
  content_type = "application/json"
  default = true
  body = '''
{"status":"ok","service":"fx"}
'''

[package]
name = "fauxfield-engine"
description = "Fauxfield engine: hyper listeners, exact routing, static responses, recording."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fauxfield-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true
toml.workspace = true
getrandom.workspace = true
tokio.workspace = true
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
serde_json_path = "0.7.2"
form_urlencoded = "1.2.2"
jsonschema = { version = "0.61.0", default-features = false }
ulid = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = { version = "0.10", features = ["chacha"] }
chrono = "0.4"
urlencoding = "2"
tera = "1"
fake = { version = "5", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["v4"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls-pemfile = "2"
x509-parser = "0.16"
directories = "6"
httpdate = "1"
rustls-pki-types = "1"
mime_guess = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = "0.3"

[dev-dependencies]
tempfile.workspace = true
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "matcher"
harness = false

[lints]
workspace = true

[[bench]]
name = "render"
harness = false

[package]
name = "fauxfield"
description = "The fauxfield binary: CLI dispatch, opens the desktop app when no subcommand is given."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["gui"]
gui = ["dep:fauxfield-gui"]
# Servers and CLI only: no GPUI in the dependency tree (verified by `make verify-headless`).
headless = []
runtime-shaders = ["fauxfield-gui/runtime-shaders"]
# Hosts the MCP server inside the GUI (`--mcp-socket`, `--mcp-stdio`). Dev only; never in release.
dev-mcp = ["gui", "fauxfield-gui/dev-mcp"]

[dependencies]
fauxfield-gui = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json.workspace = true
toml_edit.workspace = true
fauxfield-mcp.workspace = true
fauxfield-model.workspace = true
fauxfield-store.workspace = true
fauxfield-control.workspace = true
fauxfield-engine.workspace = true
serde.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
rmcp.workspace = true
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
insta = { version = "1", features = ["json"] }

# Linux packages (M19), built by .github/workflows/release-extra.yml.
[package.metadata.deb]
name = "fauxfield"
maintainer = "0funct0ry"
section = "devel"
depends = "$auto, libvulkan1"
assets = [
  ["target/release/fauxfield", "usr/bin/", "755"],
  ["../../packaging/linux/fauxfield.desktop", "usr/share/applications/", "644"],
  ["../../packaging/linux/fauxfield.png", "usr/share/icons/hicolor/512x512/apps/fauxfield.png", "644"],
  ["../../README.md", "usr/share/doc/fauxfield/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "fauxfield"
assets = [
  { source = "../../target/release/fauxfield", dest = "/usr/bin/fauxfield", mode = "755" },
  { source = "../../packaging/linux/fauxfield.desktop", dest = "/usr/share/applications/fauxfield.desktop", mode = "644" },
  { source = "../../packaging/linux/fauxfield.png", dest = "/usr/share/icons/hicolor/512x512/apps/fauxfield.png", mode = "644" },
]
[package.metadata.generate-rpm.requires]
vulkan-loader = "*"

[package.metadata.wix]
upgrade-guid = "8F3EF0ED-2530-4D13-9AF0-6DB3F043DBD7"
path-guid = "A2487138-5219-40D6-8194-8DCFB8773078"
license = false
eula = false

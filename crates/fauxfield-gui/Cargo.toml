[package]
name = "fauxfield-gui"
description = "GPUI application: window shell, docks, tabs, palette, themes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Compile Metal shaders at runtime so macOS builds work without the Xcode Metal toolchain.
runtime-shaders = ["gpui/runtime_shaders"]
# In-process MCP host for agent UI testing (SPEC §11.4). Never enabled in release builds.
dev-mcp = ["dep:fauxfield-mcp", "dep:tokio", "dep:schemars", "dep:png", "dep:base64", "dep:serde_yaml_ng"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
fauxfield-model.workspace = true
fauxfield-store.workspace = true
directories = "6"
nucleo-matcher = "0.3.1"
fauxfield-mcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
png = { version = "0.18", optional = true }
base64 = { version = "0.22", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
insta = { version = "1", features = ["json"] }

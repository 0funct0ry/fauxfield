# UI state fixture (M3.1): the quit confirmation while a server runs (`request_quit` is refused when nothing runs).
steps:
  - reset
  - open: {kind: server, id: srv_users}
  - invoke: toggle_server
  - wait_for: {condition: {pointer: /servers/0/status, equals: running}}
  - command: {command: request_quit}
  - wait_for: {condition: {pointer: /modal, equals: quit_confirm}}
  - wait_idle

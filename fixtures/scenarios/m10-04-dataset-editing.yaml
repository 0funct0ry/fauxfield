# M10.04 scenario (updated by M10.07): build a Dataset in the schema designer and edit its table,
# with no Route anywhere. Needs the example workspace as the launch workspace (scripts/smoke-ui.sh
# copies it).
name: m10-04-dataset-editing
size: default
steps:
  - state: [reset]
  - click_element: {id: sidebar-tab-datasets}
  - wait_for_idle: {}
  - key: secondary-shift-p
  - type_text: "Dataset: New…"
  - key: enter
  - wait_for_idle: {}
  - assert: {pointer: /modal, equals: schema_designer}
  - type_text: products
  - click_element: {id: schema-starter-Products}
  - click_element: {id: schema-create}
  - wait_for_idle: {}
  - assert: {pointer: /dataset/declared_columns/0/0, equals: id}
  - assert: {pointer: /dataset/source, equals: static}
  - click_element: {id: ds-add-row}
  - key: escape
  - wait_for_idle: {}
  - click_element: {id: ds-add-row}
  - key: escape
  - wait_for_idle: {}
  - wait_for_idle: {}
  - assert: {pointer: /dataset/rows, equals: 2}
  - key: secondary-shift-p
  - type_text: "Dataset: Seed Data"
  - key: enter
  - wait_for_idle: {}
  - assert: {pointer: /modal, equals: seed_data}
  - key: secondary-a
  - type_text: "200"
  - click_element: {id: seed-go}
  - wait_for_idle: {}
  - assert: {pointer: /dataset/rows, equals: 202}
  - click_element: {id: ds-view-json}
  - wait_for_idle: {}
  - click_element: {id: ds-view-table}
  - set_theme: One Dark
  - wait_for_idle: {}
  - screenshot: {name: m10-04-table-one-dark}
  - set_theme: One Light
  - wait_for_idle: {}
  - screenshot: {name: m10-04-table-one-light}
  - audit: {themes: [one-dark, one-light], sizes: [default, min]}

# M19.1 scenario: example workspaces. For each embedded example: `init_workspace` (MCP, as an agent
# would), open it, check it loads without Problems, start its first Server, see it running, stop it.
# HTTP requests to every Route are covered by crates/fauxfield/tests/examples.rs.
# Writes under /tmp/fauxfield-m191 (remove that folder before a rerun) and needs ports 4001+ free.
name: m191-examples
size: default
steps:
  - state: [reset]
  - call: {tool: list_examples}
  - call: {tool: init_workspace, arguments: {path: /tmp/fauxfield-m191/ecommerce, example: ecommerce}}
  - open_workspace: /tmp/fauxfield-m191/ecommerce
  - assert: {pointer: /view, equals: workspace}
  - assert: {pointer: /problems, equals: 0}
  - assert: {pointer: /servers/0/id, equals: srv_ecommerce_cart}
  - call: {tool: start_server, arguments: {server: srv_ecommerce_cart}}
  - wait_for: {condition: {pointer: /servers/0/status, equals: running}}
  - call: {tool: stop_server, arguments: {server: srv_ecommerce_cart}}
  - wait_for: {condition: {pointer: /servers/0/status, equals: stopped}}
  - call: {tool: init_workspace, arguments: {path: /tmp/fauxfield-m191/banking, example: banking}}
  - open_workspace: /tmp/fauxfield-m191/banking
  - assert: {pointer: /view, equals: workspace}
  - assert: {pointer: /problems, equals: 0}
  - assert: {pointer: /servers/0/id, equals: srv_banking_accounts}
  - call: {tool: start_server, arguments: {server: srv_banking_accounts}}
  - wait_for: {condition: {pointer: /servers/0/status, equals: running}}

# M9 scenario: Network and error simulation. Switch the workspace network profile from the status
# bar, turn on chaos for a server (badge in the tree), and check the Server tab sections.
# Needs the example workspace as the launch workspace (scripts/smoke-ui.sh copies it).
name: m09-network
size: default
steps:
  - state: [reset]
  - assert: {pointer: /network_profile, equals: none}
  - assert_find: {text: "Network: None", ids: [status-network]}
  - click_element: {id: status-network}
  - wait_for: {condition: {pointer: /network_picker/open, equals: true}}
  - type_text: slow
  - key: enter
  - wait_for_idle: {}
  - assert: {pointer: /network_profile, equals: slow-3g}
  # Offline is a profile too.
  - invoke: switch_network_profile
  - wait_for: {condition: {pointer: /network_picker/open, equals: true}}
  - type_text: offline
  - key: enter
  - wait_for_idle: {}
  - assert: {pointer: /network_profile, equals: offline}
  - invoke: switch_network_profile
  - wait_for: {condition: {pointer: /network_picker/open, equals: true}}
  - type_text: none
  - key: enter
  - wait_for_idle: {}
  - assert: {pointer: /network_profile, equals: none}
  # Chaos on a server: badge in the tree.
  - state: [{open: {kind: server, id: srv_users}}, wait_idle]
  - invoke: toggle_chaos
  - wait_for_idle: {}
  - assert: {pointer: /servers/0/chaos, equals: 0.2}
  - assert_find: {text: random fault, ids: [tree-chaos-srv_users]}
  - invoke: toggle_chaos
  - wait_for_idle: {}
  # The Server tab has the Network and Rate limit fields.
  - assert_find: {text: Latency, ids: [net-latency]}
  - assert_find: {text: Window, ids: [rate-window]}
  - audit: {max_errors: 0}

schema = 1
id = "srv_web"
name = "Web"
port = 4310

[tls]
enabled = true
mode = "dev-ca"
also_http_port = 4311

[cors]
enabled = true
origins = ["http://localhost:*", "http://127.0.0.1:*"]
methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
headers = ["*"]
credentials = true
max_age = 600

[[routes]]
id = "rte_ping"
method = "GET"
path = "/api/ping"
[[routes.responses]]
id = "rsp_ping"
name = "OK"
default = true
status = 200
body = '{"ok":true}'
content_type = "application/json"

[[routes]]
id = "rte_public"
kind = "static"
path = "/*"
dir = "public"
index = "index.html"
template_extensions = [".tera"]

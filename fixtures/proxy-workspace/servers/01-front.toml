schema = 1
id = "srv_front"
name = "Front"
port = 4720

# Partial mocking: only /health and /orders/latest are mocked; everything else goes upstream.
[proxy]
enabled = true
upstream = "{{ vars.upstream }}"
mode = "fallback"

[proxy.request_headers]
"x-forwarded-by" = "fauxfield"

[[routes]]
id = "rte_health"
method = "GET"
path = "/health"
[[routes.responses]]
id = "rsp_health"
name = "OK"
default = true
status = 200
body = '{"status":"mocked"}'
content_type = "application/json"

[[routes]]
id = "rte_forward"
method = "GET"
path = "/catalog"
proxy = true
[[routes.responses]]
id = "rsp_catalog"
name = "Stub"
default = true
status = 200
body = '{"items":[]}'
content_type = "application/json"

[[routes]]
id = "rte_pinned"
method = "GET"
path = "/orders/latest"
pinned = true
[[routes.responses]]
id = "rsp_latest"
name = "Latest"
default = true
status = 200
body = '{"id":"ord_1","total":42}'
content_type = "application/json"

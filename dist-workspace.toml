[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist), see RELEASING.md. Everything in M1 to M19 ships as v1.0.0.
[dist]
cargo-dist-version = "0.31.0"
ci = "github"
# Archives, installers and the Homebrew formula for the `fauxfield` package.
installers = ["shell", "powershell", "homebrew", "msi"]
tap = "0funct0ry/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
checksum = "sha256"
github-attestations = true
install-path = "CARGO_HOME"
install-success-msg = "Run `fauxfield version` to check, then `fauxfield` to open the app."
pr-run-mode = "plan"
# Custom jobs (signing, packages, SBOM, winget) live in .github/workflows/release-extra.yml.

[dist.dependencies.apt]
libxkbcommon-x11-dev = "*"
libwayland-dev = "*"
libvulkan-dev = "*"
libasound2-dev = "*"
libfontconfig-dev = "*"
libxcb1-dev = "*"
libssl-dev = "*"
